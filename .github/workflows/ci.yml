name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Resolve Playwright version
              id: playwright-version
              run: echo "version=$(pnpm --filter=playground exec playwright --version | cut -d ' ' -f2)" >> "$GITHUB_OUTPUT"

            # official caching pattern: https://playwright.dev/docs/ci
            # ~260MB of browser binaries per version; install below is a fast
            # no-op on cache hit, and a CDN-flake-free restore beats a download
            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
                  # patch releases often share browser revisions -> partial hits
                  restore-keys: playwright-${{ runner.os }}-

            - name: Build
              run: pnpm build

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Install Playwright Chromium
              run: pnpm --filter=playground exec playwright install chromium --with-deps

            - name: E2E
              run: pnpm play:e2e
              env:
                  PW_HEADLESS: "1"
